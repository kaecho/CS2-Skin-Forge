<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c212e"/>
      <stop offset="1" stop-color="#0b0d13"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <!-- Subtle inner border -->
  <rect x="10" y="10" width="1004" height="1004" rx="220" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="8"/>

  <!-- Crosshair ring -->
  <circle cx="512" cy="512" r="212" fill="none" stroke="url(#accent)" stroke-width="58"/>

  <!-- Crosshair ticks -->
  <g fill="url(#accent)">
    <rect x="483" y="128" width="58" height="150" rx="29"/>
    <rect x="483" y="746" width="58" height="150" rx="29"/>
    <rect x="128" y="483" width="150" height="58" rx="29"/>
    <rect x="746" y="483" width="150" height="58" rx="29"/>
  </g>

  <!-- Center dot -->
  <circle cx="512" cy="512" r="66" fill="url(#accent)"/>
</svg>
